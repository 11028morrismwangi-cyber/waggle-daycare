<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cognitive Camera Vision</title>
    <script type="text/javascript">
      // Single Page Apps routing fallback for GitHub Pages
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=' +
        l.pathname.split('/').slice(1 + segmentCount).join('/').replace(/&/g, '~and~') +
        l.search.replace(/&/g, '~and~') + l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
